<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Birthday Message — Nikitha (The Strong Woman)</title>

<!-- Playful font for roasts + clean variable font stack -->
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-left:#fff2f8; --bg-right:#f4f8ff;
    --card:#ffffff; --deep:#3e2850; --muted:#6f5b78;
    --accent1:#f4a1ff; --accent2:#9aa7ff;
    --sun:#ffd67a;
    --line-delay:3200ms; /* 3.2s */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg-left),var(--bg-right));-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--deep)}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;}
  .card{width:100%;max-width:1100px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94));box-shadow:0 22px 60px rgba(120,80,160,0.08);padding:22px;position:relative;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .avatar{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#ffd6ee,#e7d7ff);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--deep)}
  h1{margin:0;font-size:24px;line-height:1;color:var(--deep);font-weight:800}
  p.lead{margin:4px 0 0;color:var(--muted);font-size:14px}

  .toparea{display:flex;flex-direction:column}
  .since-counter{margin-top:10px;font-size:14px;color:var(--muted);font-weight:700;padding:8px 12px;border-radius:10px;display:inline-block;background:linear-gradient(90deg, rgba(255,250,244,0.96), rgba(255,255,255,0.96));box-shadow:0 8px 20px rgba(220,200,230,0.06)}

  .stage{margin-top:14px;border-radius:12px;padding:4px;background:transparent;display:flex;flex-direction:column;align-items:center;position:relative;min-height:360px}
  .car-wrap{width:100%;display:flex;align-items:center;justify-content:center;padding:12px}
  svg#car{width:68%;max-width:760px;height:auto;transition:transform 1s cubic-bezier(.22,.9,.25,1), opacity 900ms ease}

  .controls{display:flex;gap:12px;align-items:center;justify-content:flex-start;margin-top:18px}
  .btn{padding:12px 16px;border-radius:14px;border:0;font-weight:800;cursor:pointer;font-size:15px;box-shadow:0 10px 28px rgba(120,80,160,0.06)}
  .primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:white}
  .ghost{background:linear-gradient(90deg,#fff,#fff);color:var(--deep);border:1px solid rgba(120,80,160,0.06)}

  .messages{margin-top:18px;padding:18px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.98),rgba(255,255,255,0.96));max-height:48vh;overflow:auto;display:none}
  .line{opacity:0;transform:translateY(14px);transition:opacity 1200ms ease, transform 1200ms ease;margin:12px 0;color:var(--deep);font-size:17px;line-height:1.5}
  .line.visible{opacity:1;transform:translateY(0)}
  .small{font-size:13px;color:var(--muted)}
  .controls-in-messages{margin-top:12px;display:flex;gap:12px;flex-direction:column;align-items:stretch}
  textarea.wish{width:100%;min-height:110px;border-radius:12px;padding:10px;border:1px solid rgba(200,180,200,0.12);font-size:15px;resize:vertical}

  .next-counter{margin-top:12px;text-align:center;font-size:15px;color:var(--muted);font-weight:700;padding:8px 12px;border-radius:10px;background:linear-gradient(90deg, rgba(255,250,244,0.96), rgba(255,255,255,0.96));box-shadow:0 8px 20px rgba(220,200,230,0.04);display:none}

  /* Feather layer (angel) */
  .feather-layer{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
  .feather{position:absolute;border-radius:24px;background:linear-gradient(90deg, rgba(255,250,252,0.98), rgba(255,236,244,0.92));opacity:0.22;filter:blur(.4px);transform-origin:center}

  /* sparkles */
  .sparkles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,220,140,0.95);box-shadow:0 0 10px rgba(255,210,120,0.6);opacity:0.08}

  /* roast chat bubble styles */
  .roast-bubble{
    width:90%;max-width:820px;margin:12px auto;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,0.96);
    box-shadow:0 8px 20px rgba(120,80,160,0.06);position:relative;overflow:visible;font-family:'Comic Neue', Inter, sans-serif;font-weight:700;color:#744B8E;
    transform:translateY(14px);opacity:0;transition:opacity 800ms ease, transform 800ms cubic-bezier(.22,.9,.25,1)
  }
  .roast-bubble.visible{opacity:1;transform:translateY(0)}
  .bubble-spark{position:absolute;left:10px;top:-10px;font-size:18px;pointer-events:none}
  .roast-buttons{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .roast-btn{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:800}

  .afterglow{position:absolute;left:18px;right:18px;top:18px;bottom:18px;border-radius:14px;pointer-events:none;background:radial-gradient(circle at 50% 30%, rgba(255,232,200,0.12), rgba(255,240,240,0.06));opacity:0;transition:opacity 1s ease;z-index:4}

  /* contextual icon visual container (appears around text reveal) */
  .visual-icon{position:absolute;right:18px;top:18px;width:72px;height:72px;opacity:0;pointer-events:none;transition:opacity 400ms ease, transform 600ms cubic-bezier(.22,.9,.25,1);z-index:3}

  /* final night-sky overlay (faint stars) */
  .night-sky{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(60,30,80,0.02), rgba(30,18,50,0.12));opacity:0;transition:opacity 1400ms ease;z-index:3}
  .stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1000ms ease;z-index:4}

  /* responsive */
  @media (max-width:900px){
    .card{padding:16px}
    h1{font-size:20px}
    svg#car{width:92%}
    .messages{max-height:56vh}
    .visual-icon{width:58px;height:58px;right:10px;top:10px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main" aria-labelledby="title">

      <!-- decorative layers -->
      <div class="feather-layer" id="featherLayer" aria-hidden="true"></div>
      <div class="sparkles" id="sparklesArea" aria-hidden="true"></div>
      <div class="night-sky" id="nightSky" aria-hidden="true"></div>
      <div class="stars" id="starsLayer" aria-hidden="true"></div>
      <div class="afterglow" id="afterglow" aria-hidden="true"></div>

      <!-- header -->
      <header>
        <div class="avatar">N</div>
        <div class="toparea">
          <h1 id="title">Birthday Message — Nikitha (The Strong Woman)</h1>
          <p class="lead">Open, press <em>Start the Car</em>, and enjoy the message ❤️</p>
          <div class="since-counter" id="sinceCounter" aria-hidden="true"></div>
        </div>
      </header>

      <!-- contextual icon (SVG) -->
      <div class="visual-icon" id="visualIcon" aria-hidden="true"></div>

      <!-- main stage -->
      <section class="stage" id="stage">
        <div class="car-wrap" id="carWrap">
          <svg id="car" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pink sports car">
            <ellipse cx="400" cy="250" rx="240" ry="28" fill="rgba(100,40,100,0.06)"/>
            <g id="carBody">
              <path d="M120 200 Q140 150 220 140 L540 140 Q600 140 640 170 L700 210 Q680 230 620 230 L200 230 Q160 230 120 200 Z" fill="#ffd6e6" stroke="#ffb6da" stroke-width="2"/>
              <path d="M260 140 Q320 110 420 110 Q500 110 540 140" fill="#eef6ff" stroke="#cfe8ff" stroke-width="2" />
              <g>
                <circle cx="250" cy="240" r="30" fill="#2b2b2b"/>
                <circle cx="250" cy="240" r="18" fill="#ffd6e6"/>
                <circle cx="570" cy="240" r="30" fill="#2b2b2b"/>
                <circle cx="570" cy="240" r="18" fill="#ffd6e6"/>

            </g>

      <!-- message container -->
      <div class="messages" id="messageBox" aria-live="polite">

      <footer class="small" style="margin-top:14px;text-align:center;color:var(--muted)">Tip: after finishing the flow you'll be prompted to download a response file you can share back with Pragadeesh.</footer>
    </main>
  </div>

<script>
/* ================= CONFIG ================= */
const LINE_DELAY = 3200; // 3.2s per line
const BIRTHDAY_ISO = '2004-11-21T00:00:00Z';
const INTRO_LINES = [
  "Happy Birthday, NIKITHA CATHRYN.N 🌸",

/* Roast templates and mapping */
const ROASTS = [
  {
    id:'mood',
    lines:[
      "Okay, so maybe the day wasn’t great…",

  },
  {
    id:'baby',
    lines:[
      "You always say you’re this big strong woman…",

      "Strong? Yes. Mature? Debatable. Adorable? Absolutely 🍼💛"
    ],
    color:'#ffc0d6', // pink
    label:'Baby strong'
  }
];

const EASTER_LINE = "Brave choice… you really are the strong woman — emotionally, not physically 😌😂";

/* ================= DOM refs ================= */
const startBtn = document.getElementById('startCarBtn');
const skipBtn = document.getElementById('skipCarBtn');
const car = document.getElementById('car');
const messageBox = document.getElementById('messageBox');
const controlsInMessages = document.getElementById('controlsInMessages');
const featherLayer = document.getElementById('featherLayer');
const sparklesArea = document.getElementById('sparklesArea');
const sinceCounterEl = document.getElementById('sinceCounter');
const visualIcon = document.getElementById('visualIcon');
const nightSky = document.getElementById('nightSky');
const starsLayer = document.getElementById('starsLayer');
const afterglow = document.getElementById('afterglow');

const responses = { started_at: new Date().toISOString(), answers: {} };

/* ---------- Utilities ---------- */
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function mk(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

/* ---------- Feather & sparkles (angel motif) ---------- */
function spawnFeathers(count=6){
  // clear any existing and spawn visible feathers
  for(let i=0;i<count;i++){
    const f = mk('div','feather');
    const left = 8 + Math.random()*50;
    const top = 40 + Math.random()*35;
    f.style.left = left + '%';
    f.style.top = top + '%';
    f.style.width = (36 + Math.random()*30) + 'px';
    f.style.height = (16 + Math.random()*14) + 'px';
    f.style.opacity = 0.16 + Math.random()*0.18;
    featherLayer.appendChild(f);
    const dur = 9000 + Math.random()*12000;
    f.animate([
      { transform: `translateY(0px) rotate(${ -20 + Math.random()*40 }deg)`, opacity: f.style.opacity },
      { transform: `translateY(-160px) translateX(${20 + Math.random()*80}px) rotate(${10 + Math.random()*60}deg)`, opacity: 0.02 }
    ], { duration: dur, iterations: 1, easing: 'cubic-bezier(.2,.9,.2,1)'});
    setTimeout(()=> f.remove(), dur + 200);
  }
}
function spawnSparkles(count=10){
  for(let i=0;i<count;i++){
    const s = mk('div','spark');
    s.style.left = (8 + Math.random()*82) + '%';
    s.style.top = (16 + Math.random()*62) + '%';
    sparklesArea.appendChild(s);
    const dur = 6000 + Math.random()*11000;
    setTimeout(()=> {
      s.style.transform = `translateY(-${10 + Math.random()*40}px) translateX(${(Math.random()-0.5)*60}px)`;
      s.style.opacity = 0.02 + Math.random()*0.06;
    }, 200 + Math.random()*900);
    setTimeout(()=> s.remove(), dur + 1200);
  }
}

/* ---------- visual icon pool (small inline svg silhouettes) ---------- */
function showVisualFor(text){
  // based on keywords in text choose a small icon to show briefly
  const lower = text.toLowerCase();
  let svg = '';
  if(/\btemple|kovil|temp\b/.test(lower)) svg = iconTemple();
  else if(/\bchurch\b/.test(lower)) svg = iconChurch();
  else if(/\bhill|hill(s)?|trek|adventure\b/.test(lower)) svg = iconHills();
  else if(/\bpark|nature|leaves\b/.test(lower)) svg = iconPark();
  else if(/\bstar|sunshine|shine\b/.test(lower)) svg = iconStar();
  else if(/\bcat\b/.test(lower)) svg = iconCat();
  else if(/\b(song|listen|asmr|f.r.i.e.n.d.s|friends)\b/.test(lower)) svg = iconMusic();
  else if(/\b(spice|spice dreams|food|cook|kitchen|diet)\b/.test(lower)) svg = iconFood();
  else if(/\brain|jojo\b/.test(lower)) svg = iconRain();
  else svg = '';
  if(!svg) return;
  visualIcon.innerHTML = svg;
  visualIcon.style.opacity = '1';
  visualIcon.style.transform = 'translateY(0px) scale(1)';
  setTimeout(()=> { visualIcon.style.opacity = '0'; visualIcon.style.transform = 'translateY(-6px) scale(.98)'; }, 3000);
}
function iconTemple(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#ffd7b2" d="M32 6L4 20h8v8h12v-6h8v6h12v-8h8z"/><rect x="20" y="28" width="24" height="20" rx="2" fill="#fff1f6"/></svg>`; }
function iconChurch(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#cfe8ff" d="M32 4l-12 8v36h24V12z"/><rect x="28" y="22" width="8" height="10" fill="#fff"/></svg>`; }
function iconHills(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#d6f2d8" d="M2 46c12-20 24-20 34-6 10-12 26-4 26-4v24H2z"/></svg>`; }
function iconPark(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="18" cy="28" r="8" fill="#dff0e6"/><rect x="14" y="36" width="8" height="14" fill="#8ebf8d"/></svg>`; }
function iconStar(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><polygon points="32,6 38,24 58,24 42,36 48,54 32,42 16,54 22,36 6,24 26,24" fill="#ffd67a"/></svg>`; }
function iconCat(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M20 36c0-8 8-14 12-14s12 6 12 14v6H20z" fill="#ffd6e6"/><circle cx="26" cy="34" r="2" fill="#fff"/><circle cx="38" cy="34" r="2" fill="#fff"/></svg>`; }
function iconMusic(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M44 10v28l-20 6V16z" fill="#cde7ff"/></svg>`; }
function iconFood(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="14" fill="#ffd7b2"/><path d="M18 42h28v6H18z" fill="#fff"/></svg>`; }
function iconRain(){ return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M32 8c-8 10-8 18 0 28 8-10 8-18 0-28z" fill="#cfe8ff"/><g fill="#a6d3ff"><path d="M22 48l-3 6h6z"/><path d="M30 48l-3 6h6z"/></g></svg>`; }

/* ---------- reveal helper ---------- */
function revealLine(text){
  const el = mk('div','line', text);
  messageBox.insertBefore(el, controlsInMessages);
  // contextual visual
  showVisualFor(text);
  setTimeout(()=> el.classList.add('visible'), 120);
  messageBox.scrollTop = messageBox.scrollHeight;
}

/* ---------- message controls ---------- */
function clearMessageControls(){ controlsInMessages.innerHTML = ''; }

function createYesNoControls(callback, yesLabel='Yes', noLabel='No'){
  clearMessageControls();
  const cont = mk('div','',''); cont.style.display='flex'; cont.style.gap='10px'; cont.style.justifyContent='center';
  const yes = mk('button','btn primary', yesLabel);
  const no = mk('button','btn ghost', noLabel);
  yes.onclick = ()=> { cont.remove(); callback(true); };
  no.onclick = ()=> { cont.remove(); callback(false); };
  cont.appendChild(yes); cont.appendChild(no);
  controlsInMessages.appendChild(cont);
  yes.focus();
}

function createRatingControl(callback){
  clearMessageControls();
  const container = mk('div','',''); container.style.display='flex'; container.style.flexDirection='column'; container.style.gap='12px'; container.style.alignItems='center';
  const row = mk('div','',''); row.style.display='flex'; row.style.gap='12px'; row.style.alignItems='center';
  const slider = mk('input','',''); slider.type='range'; slider.min=1; slider.max=10; slider.value=8; slider.style.width='170px';
  const badge = mk('div','small', slider.value);
  slider.oninput = ()=> badge.textContent = slider.value;
  const ok = mk('button','btn primary','Submit');
  ok.onclick = ()=> { container.remove(); callback(parseInt(slider.value,10)); };
  row.appendChild(slider); row.appendChild(badge);
  container.appendChild(row); container.appendChild(ok);
  controlsInMessages.appendChild(container);
}

function createTextPrompt(callback, placeholder='Type your wish here (or leave empty to skip)'){
  clearMessageControls();
  const container = mk('div','',''); container.style.display='flex'; container.style.flexDirection='column'; container.style.gap='10px';
  const ta = mk('textarea','wish'); ta.placeholder = placeholder;
  const row = mk('div','',''); row.style.display='flex'; row.style.gap='10px'; row.style.justifyContent='center';
  const save = mk('button','btn primary','Save'); const skip = mk('button','btn ghost','Skip');
  save.onclick = ()=> { container.remove(); callback(ta.value.trim()); };
  skip.onclick = ()=> { container.remove(); callback(''); };
  row.appendChild(save); row.appendChild(skip);
  container.appendChild(ta); container.appendChild(row);
  controlsInMessages.appendChild(container);
  ta.focus();
}

/* ---------- counters ---------- */
function startSinceCounter(el){
  const birth = new Date(BIRTHDAY_ISO).getTime();
  function update(){
    const now = Date.now();
    let diff = Math.max(0, now - birth);
    const seconds = Math.floor(diff / 1000);
    const days = Math.floor(seconds / 86400);
    const weeks = Math.floor(days / 7);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    el.textContent = `Since 21/11/2004 — ${days} days • ${weeks} weeks • ${hours} hrs • ${minutes} mins • ${secs} s`;
    el.style.display = 'inline-block';
  }
  update();
  return setInterval(update, 1000);
}
function startNextBirthdayCounter(el){
  function getNext(){
    const now = new Date();
    const year = now.getFullYear();
    let target = new Date(year, 10, 21, 0,0,0);
    if(now > target) target = new Date(year+1, 10, 21, 0,0,0);
    return target.getTime();
  }
  function update(){
    const target = getNext();
    const now = Date.now();
    let diff = Math.max(0, target - now);
    const seconds = Math.floor(diff / 1000);
    const days = Math.floor(seconds / 86400);
    const weeks = Math.floor(days / 7);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    el.textContent = `Time until your next birthday — ${days} days • ${weeks} weeks • ${hours} hrs • ${minutes} mins • ${secs} s`;
    el.style.display = 'block';
  }
  update();
  return setInterval(update, 1000);
}

/* ---------- roast bubble helpers ---------- */
function showRoastBubble(lines, color, sparkleColor){
  return new Promise(async (resolve)=>{
    const bubble = mk('div','roast-bubble');
    bubble.style.border = `2px solid ${color}`;
    const sparkleEl = mk('div','bubble-spark','✨');
    sparkleEl.style.color = sparkleColor;
    bubble.appendChild(sparkleEl);
    // lines inside bubble
    for(let i=0;i<lines.length;i++){
      const p = mk('div','','');
      p.innerHTML = lines[i];
      p.style.margin = '6px 0';
      bubble.appendChild(p);
    }
    messageBox.insertBefore(bubble, controlsInMessages);
    // bubble reveal animation
    setTimeout(()=> bubble.classList.add('visible'), 80);
    // sparkle drift animation
    const drift = sparkleEl.animate([
      { transform:'translateY(0) scale(1)', opacity:1 },
      { transform:'translateY(-26px) scale(.95)', opacity:0.12 }
    ], { duration: 3200, easing:'cubic-bezier(.22,.9,.25,1)'});
    // twinkle stars / sparkles
    spawnSparkles(6);
    // wait total time for reading: approximate per-line (LINE_DELAY) + small gap
    const total = lines.length * LINE_DELAY + 650;
    await sleep(total);
    resolve();
  });
}

/* ---------- roast segment logic ---------- */
async function runRoastSegment(){
  // pick a random roast
  const idx = Math.floor(Math.random()*ROASTS.length);
  const first = ROASTS[idx];
  await showRoastBubble(first.lines, first.color, first.color);
  // ask if she wants more
  revealLine("That was mild — do you want me to roast you more, strong woman? 😏");
  createYesNoControls(async (want)=>{
    if(!want){
      // no: gentle tease then continue
      const bubble = mk('div','roast-bubble'); bubble.style.border='2px solid #d6c8ff'; bubble.innerHTML = `<div class="bubble-spark" style="color:#cdb4ff">✨</div><div style="padding-top:6px">Fine, I’ll spare you this time 😂 But don’t act innocent — you know you deserved at least one more roast.</div>`;
      messageBox.insertBefore(bubble, controlsInMessages);
      setTimeout(()=> bubble.classList.add('visible'),80);
      await sleep(1800);
      return;
    }
    // yes: Easter-egg then remaining roasts
    const eggBubble = mk('div','roast-bubble');
    eggBubble.style.border = '2px solid #ffd67a'; eggBubble.innerHTML = `<div class="bubble-spark" style="color:#ffd67a">✨</div><div style="padding-top:6px">${EASTER_LINE}</div>`;
    messageBox.insertBefore(eggBubble, controlsInMessages);
    setTimeout(()=> eggBubble.classList.add('visible'),80);
    spawnSparkles(8);
    await sleep(2000);

    // show remaining roasts in random order skipping first
    const remaining = ROASTS.filter(r=>r.id!==first.id);
    for(let r of remaining){
      await showRoastBubble(r.lines, r.color, r.color);
      await sleep(400);
    }
    // final wrap bubble
    const wrap = mk('div','roast-bubble'); wrap.style.border='2px solid #e6c7f6'; wrap.innerHTML = `<div class="bubble-spark" style="color:#cdb4ff">✨</div><div style="padding-top:6px">Alright, that’s enough roasting — time to calm that strong-woman energy ❤️</div>`;
    messageBox.insertBefore(wrap, controlsInMessages);
    setTimeout(()=> wrap.classList.add('visible'),80);
    await sleep(1600);
  });
}

/* ---------- main flow ---------- */
async function startCarSequence(){
  startBtn.disabled = true; skipBtn.disabled = true;
  // show since counter
  const sinceInterval = startSinceCounter(sinceCounterEl);
  // visual kicks: car motion, sparkles, feathers
  car.style.transform = 'translateY(-6px) scale(1.02)';
  spawnSparkles(12); spawnFeathers(6);
  messageBox.style.display = 'block';
  await sleep(700);

  // permission prompt
  revealLine("Sorry for this, strong woman — I need some answers to continue. Could I get your permission to ask a few questions?");
  createYesNoControls(async (perm)=>{
    responses.answers.permission = !!perm;
    if(!perm){
      revealLine("I understand — I won't ask. Still — happy birthday, NIKITHA 💛");
      await sleep(1200);
      await showFullMessageFlow(false);
      clearInterval(sinceInterval);
      return;
    }
    revealLine("Thank you — I appreciate that. First: on a scale of 1 to 10, how good was your day?");
    createRatingControl(async (rating)=>{
      responses.answers.day_rating = rating;
      if(rating <= 5){
        revealLine("Hey — bad days happen. I’m really sorry you had a tough one, it makes me sad to hear that.");
        await sleep(900);
        revealLine("You’re still so strong — even when it feels heavy, you keep going.");
        await sleep(900);
        revealLine("I feel sad that you had to go through that — I care about you, deeply.");
        await sleep(900);
        revealLine("I’m here for you, and if there's anything I can do I will try — please tell me.");
      } else {
        revealLine("That’s wonderful to hear — I’m genuinely happy your day was good. 😊");
        await sleep(900);
        revealLine("Keep this feeling with you — your strength and joy matter to everyone around you.");
        await sleep(900);
        revealLine("Keep shining, sunshine — you deserve every good thing coming your way.");
      }
      await sleep(1000);
      await showFullMessageFlow(true);
      clearInterval(sinceInterval);
    });
  });
}

async function runMessageFlowOnSkip(){
  startBtn.disabled = true; skipBtn.disabled = true;
  spawnSparkles(8); spawnFeathers(4);
  messageBox.style.display = 'block';
  await sleep(400);
  revealLine("Sorry for this, strong woman — I need some answers to continue. Could I get your permission to ask a few questions?");
  createYesNoControls(async (perm)=>{
    responses.answers.permission = !!perm;
    if(!perm){ revealLine("I understand — I won't ask. Still — happy birthday, NIKITHA 💛"); await sleep(1100); await showFullMessageFlow(false); return; }
    revealLine("Thank you — I appreciate that. First: on a scale of 1 to 10, how good was your day?");
    createRatingControl(async (rating)=>{
      responses.answers.day_rating = rating;
      if(rating <=5){
        revealLine("Hey — bad days happen. I’m really sorry you had a tough one, it makes me sad to hear that.");
        await sleep(900); revealLine("You’re still so strong — even when it feels heavy, you keep going.");
        await sleep(900); revealLine("I feel sad that you had to go through that — I care about you, deeply.");
        await sleep(900); revealLine("I’m here for you, and if there's anything I can do I will try — please tell me.");
      } else {
        revealLine("That’s wonderful to hear — I’m genuinely happy your day was good. 😊");
        await sleep(900); revealLine("Keep this feeling with you — your strength and joy matter to everyone around you.");
        await sleep(900); revealLine("Keep shining, sunshine — you deserve every good thing coming your way.");
      }
      await sleep(1000);
      await showFullMessageFlow(true);
    });
  });
}

async function showFullMessageFlow(includeAnswers){
  for(let i=0;i<INTRO_LINES.length;i++){
    revealLine(INTRO_LINES[i]);
    if(i%3===0){ spawnSparkles(6); spawnFeathers(2); }
    await sleep(LINE_DELAY);
  }

  revealLine("Do you still have patience to read just a few more lines?");
  createYesNoControls(async (keep)=>{
    responses.answers.keep_reading = !!keep;
    if(!keep){
      revealLine("Okay, I get it. Sending love — Happy birthday again, NIKITHA.");
      await sleep(LINE_DELAY);
      await promptWishesAndFinish();
      return;
    }

    // personal block (long)
    for(let m of AFTER_PATIENCE_PERSONAL){
      revealLine(m);
      spawnSparkles(5); spawnFeathers(2);
      await sleep(LINE_DELAY + 400);
    }

    for(let m of EXTRA_AFTER_PATIENCE){
      revealLine(m); spawnSparkles(4);
      await sleep(LINE_DELAY);
    }

    for(let ln of FINAL_LINES){
      revealLine(ln); await sleep(LINE_DELAY);
    }

    await promptWishesAndFinish();
  });
}

async function promptWishesAndFinish(){
  revealLine("If there’s any wish I can help with, tell me — if not, that’s okay.");
  createTextPrompt(async (wish)=>{
    responses.answers.wish = wish || null;
    revealLine(wish ? "Got it ❤️ I’ll remember that." : "Alright 😊 maybe next time.");
    await sleep(900);

    // roast segment (interactive)
    await runRoastSegment();

    // next-birthday counter (before good night)
    const nextCounter = mk('div','next-counter');
    messageBox.appendChild(nextCounter);
    startNextBirthdayCounter(nextCounter);

    await sleep(900);
    revealLine("Good night, spice dreams, jojo well, NIKITHA (strong woman) 🌙");
    revealLine("- Pragadeesh");
    revealLine("<div style='margin-top:8px;font-weight:700;color:#b86f9f'>💛 From Pragadeesh aka Levi</div>");

    // show gentle night-sky (fade in) and afterglow fade-out
    nightSky.style.opacity = '1';
    starsLayer.style.opacity = '0.6';
    afterglow.style.opacity = '1';
    setTimeout(()=> { afterglow.style.transition = 'opacity 30s linear'; afterglow.style.opacity = '0'; }, 1200);

    await sleep(1200);
    showDownloadOption();
  });
}

/* ---------- download / send UI ---------- */
function showDownloadOption(){
  clearMessageControls();
  responses.finished_at = new Date().toISOString();
  const ts = new Date().toISOString().replace(/[:.]/g,'').slice(0,15);
  const filename = `birthday_response_${ts}.json`;
  const blob = new Blob([JSON.stringify(responses, null, 2)], { type: 'application/json' });
  const fileUrl = URL.createObjectURL(blob);

  const noteWrap = mk('div','download-note');
  noteWrap.style.marginTop='12px'; noteWrap.style.padding='12px'; noteWrap.style.borderRadius='10px';
  noteWrap.style.background='linear-gradient(90deg, rgba(255,250,244,0.96), rgba(255,255,255,0.96))';
  noteWrap.style.textAlign='center';
  noteWrap.innerHTML = `<div>Please click the button below to download your response file.<br>After downloading, please send the file to Pragadeesh so he can have your response.</div>
    <button id="downloadRespBtn" style="margin-top:10px;padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,#ffd67a,#ffb6c1);border:0;color:#5b2b6b;font-weight:800;cursor:pointer">Download responses</button>`;
  messageBox.appendChild(noteWrap);

  const sendPanel = mk('div','send-panel');
  sendPanel.style.marginTop='12px'; sendPanel.style.padding='12px'; sendPanel.style.borderRadius='10px';
  sendPanel.style.background='rgba(255,255,255,0.98)'; sendPanel.style.border='1px solid rgba(230,210,240,0.6)';
  sendPanel.innerHTML = `
    <div style="font-weight:700;color:#5b375e">Send directly to Pragadeesh</div>
    <div style="font-size:13px;color:#6f5b78;margin-top:6px">Enter a phone number (with country code) or an email, or leave empty to choose on your device.</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="sendRecipient" style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(200,180,200,0.12)" placeholder="+919876543210 or pragadeesh@example.com" value="+918148494339" />
    </div>
    <textarea id="sendMessage" style="width:100%;min-height:76px;border-radius:8px;padding:8px;border:1px solid rgba(200,180,200,0.12);margin-top:8px">Hi Pragadeesh — I downloaded my birthday response. I’ve attached the file 'REPLACE_FILENAME' (please rename after download if needed). — Nikitha</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button id="whatsappSend" style="padding:10px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,#ffd6e6,#e7d7ff);color:#5b2b6b;font-weight:700;cursor:pointer">Send by WhatsApp</button>
      <button id="emailSend" style="padding:10px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,#ffd6e6,#e7d7ff);color:#5b2b6b;font-weight:700;cursor:pointer">Send by Email</button>
      <button id="copySend" style="padding:10px 12px;border-radius:8px;border:0;background:linear-gradient(90deg,#ffd6e6,#e7d7ff);color:#5b2b6b;font-weight:700;cursor:pointer">Copy message</button>
    </div>
    <div style="font-size:13px;color:#6f5b78;margin-top:10px">Note: please attach the downloaded JSON file when sending. The app will open your chosen messenger — you'll need to attach the file manually.</div>
  `;
  messageBox.appendChild(sendPanel);
  messageBox.scrollTop = messageBox.scrollHeight;

  document.getElementById('downloadRespBtn').addEventListener('click', ()=> {
    const a = document.createElement('a'); a.href = fileUrl; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('downloadRespBtn').textContent = 'Downloaded — thank you 💾'; document.getElementById('downloadRespBtn').disabled = true;
  });

  const waBtn = document.getElementById('whatsappSend');
  const emailBtn = document.getElementById('emailSend');
  const copyBtn = document.getElementById('copySend');
  const sendRecipient = document.getElementById('sendRecipient');
  const sendMessage = document.getElementById('sendMessage');
  sendMessage.value = sendMessage.value.replace('REPLACE_FILENAME', filename);

  waBtn.addEventListener('click', ()=> {
    const recipient = sendRecipient.value.trim();
    const text = encodeURIComponent(sendMessage.value + "\n\n(Attach the downloaded file to this message.)");
    let url;
    if(recipient && /^[+0-9]{6,}$/.test(recipient.replace(/\s|-/g,''))){
      const phone = recipient.replace(/\s|\-/g,'');
      url = `https://api.whatsapp.com/send?phone=${encodeURIComponent(phone)}&text=${text}`;
    }else{ url = `https://api.whatsapp.com/send?text=${text}`; }
    window.open(url, '_blank');
  });

  emailBtn.addEventListener('click', ()=> {
    const recipient = sendRecipient.value.trim();
    const subject = encodeURIComponent('Birthday response for Pragadeesh');
    const body = encodeURIComponent(sendMessage.value + "\n\n(Please attach the downloaded JSON file to this email.)");
    let mailto = 'mailto:';
    if(recipient && recipient.includes('@')) mailto += encodeURIComponent(recipient);
    mailto += `?subject=${subject}&body=${body}`;
    window.location.href = mailto;
  });

  copyBtn.addEventListener('click', ()=> {
    navigator.clipboard.writeText(sendMessage.value).then(()=> {
      copyBtn.textContent = 'Copied ✅';
      setTimeout(()=> copyBtn.textContent = 'Copy message', 1600);
    }).catch(()=> alert('Copy failed — please select and copy the message manually.'));
  });
}
